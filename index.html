<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Unit Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="iphone-container">
        <div class="status-bar">
            <span class="time" id="clock">9:41</span>
            <div class="dynamic-island"></div>
            <div class="status-icons">📶 🔋</div>
        </div>

        <div class="app-content">
            <h1>Converter</h1>
            
            <div class="ios-picker-wrap">
                <select id="category">
                    <option value="mass">Mass (Weight)</option>
                    <option value="length">Length</option>
                    <option value="volume">Volume</option>
                </select>
            </div>

            <div class="input-group">
                <select id="unitFrom"></select>
                <input type="number" id="inputVal" placeholder="0">
            </div>

            <div class="swap-icon">⇅</div>

            <div class="input-group">
                <select id="unitTo"></select>
                <input type="number" id="outputVal" placeholder="0" readonly>
            </div>
        </div>
        
        <div class="home-indicator"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
